# Fly.io config for the FastAPI token backend.
# Run `fly deploy` from this `backend/` directory (change `app` to a unique name).
# Set secrets with:  fly secrets set GEMINI_API_KEY=... AUTH_TOKEN=...

app = "realtime-voiceagent-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
